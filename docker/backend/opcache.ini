; JIT desactive explicitement : opcache.jit=tracing + jit_buffer_size=0 (les
; valeurs par defaut de l'extension) provoquent un blocage silencieux des
; requetes PHP-FPM sur certaines builds de PHP 8.2 (repro : toute requete
; HTTP passant par public/index.php reste bloquee indefiniment, alors que
; "php artisan" en CLI fonctionne normalement puisque opcache.enable_cli
; est desactive par defaut). Sans interet pour une appli web classique.
opcache.enable=1
opcache.jit=0
opcache.jit_buffer_size=0
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
