worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 20m;

    map $status $loggable {
        ~^[23]  0;
        default 1;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_certificate     /etc/letsencrypt/live/gestionclinique.cliniquenaby.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestionclinique.cliniquenaby.com/privkey.pem;

    # Renouvellement ACME + redirection HTTP -> HTTPS
    server {
        listen 80;
        server_name gestionclinique.cliniquenaby.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host:7777$request_uri;
        }
    }

    # Frontend (build React)
    server {
        listen 7777 ssl;
        server_name gestionclinique.cliniquenaby.com;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Backend API (Laravel)
    server {
        listen 7778 ssl;
        server_name gestionclinique.cliniquenaby.com;
        root /var/www/html/public;
        index index.php;

        location /storage/ {
            alias /var/www/html/storage/app/public/;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }

    # Adminer (BDD) - a restreindre par IP en production si possible (voir DEPLOY.md)
    server {
        listen 7779 ssl;
        server_name gestionclinique.cliniquenaby.com;

        location / {
            proxy_pass http://adminer:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
